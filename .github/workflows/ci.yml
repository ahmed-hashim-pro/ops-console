name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  e2e:
    name: keyboard, axe and modes (Playwright)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run build
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/

  perf:
    name: frame timing at 10,000 events/s
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run build
      # The batched store only, against loose thresholds (perf/run.mjs CHECK):
      # shared runners are slower and noisier than the machine in the README.
      - run: node perf/run.mjs --modes batched,naive --rates 10000 --seconds 15 --warmup 5 --out perf/check.json --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf
          path: perf/check.json

  soak:
    name: memory over ten minutes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run build
      - run: node perf/soak.mjs --minutes 10 --out perf/soak-ci.json --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soak
          path: perf/soak-ci.json
